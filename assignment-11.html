<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Accessible Web Page</title>

    <style>
        .skip-link {
            position: absolute;
            left: -9999px;
        }

        .skip-link:focus {
            left: 10px;
            top: 10px;
        }
    </style>
</head>
<body>

    <a href="#main" class="skip-link">
        Skip to Main Content
    </a>

    <header>
        <nav aria-label="Main Navigation">
            <a href="#main">Home</a> |
            <a href="#help">Help</a>
        </nav>
    </header>

    <main id="main">

        <h1>Accessible Web Page</h1>

        <img src="https://placehold.co/100x60"
             alt="College Logo"
             width="100">

        <form role="search" aria-label="Site Search">

            <label for="search">Search:</label>

            <input type="search" id="search">

            <button type="submit"
                    aria-label="Submit Search">
                Search
            </button>

        </form>

    </main>

    <footer id="help">
        Help and Contact Information
    </footer>

</body>
</html>
