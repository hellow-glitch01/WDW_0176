<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ABC College Admission 2026</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 0;
        }

        header {
            background-color: navy;
            color: white;
            text-align: center;
            padding: 15px;
        }

        main {
            width: 80%;
            margin: auto;
            padding: 20px;
        }

        table {
            border-collapse: collapse;
            width: 100%;
        }

        th, td {
            border: 1px solid black;
            padding: 10px;
            text-align: left;
        }

        fieldset {
            padding: 20px;
        }

        label {
            display: block;
            margin-top: 10px;
        }

        footer {
            background-color: navy;
            color: white;
            text-align: center;
            padding: 10px;
        }

    </style>

</head>

<body>

    <header>

        <h1>ABC College Admission 2026</h1>

    </header>

    <main>

        <section>

            <h2>Courses and Fees</h2>

            <table>

                <caption>Available Courses</caption>

                <thead>

                    <tr>
                        <th>Course</th>
                        <th>Seats</th>
                        <th>Fees</th>
                    </tr>

                </thead>

                <tbody>

                    <tr>
                        <td>B.Tech CSE</td>
                        <td>20</td>
                        <td>₹90,000</td>
                    </tr>

                    <tr>
                        <td>BCA</td>
                        <td>40</td>
                        <td>₹45,000</td>
                    </tr>

                    <tr>
                        <td>Application Fee</td>
                        <td colspan="2">₹500</td>
                    </tr>

                </tbody>

            </table>

        </section>

        <section>

            <h2>Apply Online</h2>

            <form action="#" method="get">

                <fieldset>

                    <legend>Admission Application</legend>

                    <label for="name">Name:</label>

                    <input type="text"
                           id="name"
                           name="name"
                           required
                           minlength="2">

                    <label for="email">Email:</label>

                    <input type="email"
                           id="email"
                           name="email"
                           required>

                    <label for="course">Select Course:</label>

                    <select id="course"
                            name="course"
                            required>

                        <option value="">Select Course</option>

                        <option value="btech">
                            B.Tech CSE
                        </option>

                        <option value="bca">
                            BCA
                        </option>

                    </select>

                    <label for="statement">
                        Statement:
                    </label>

                    <textarea id="statement"
                              name="statement"
                              rows="3"
                              required>
                    </textarea>

                    <br><br>

                    <button type="submit">
                        Apply
                    </button>

                </fieldset>

            </form>

        </section>

    </main>

    <footer>

        <p>&copy; 2026 ABC College</p>

    </footer>

</body>

</html>
