<!DOCTYPE html>
<html>
<head>
    <title>Multimedia Elements</title>
</head>
<body>

    <h2>Image</h2>

    <img src="https://placehold.co/320x180"
         alt="Sample image"
         width="320">

    <h2>Video</h2>

    <video width="320" controls>
        <source
        src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4"
        type="video/mp4">

        Your browser does not support video.
    </video>

    <h2>Audio</h2>

    <audio controls>
        <source
        src="https://interactive-examples.mdn.mozilla.net/media/cc0-audio/t-rex-roar.mp3"
        type="audio/mpeg">

        Your browser does not support audio.
    </audio>

    <h2>YouTube Video</h2>

    <iframe width="320"
            height="180"
            src="https://www.youtube-nocookie.com/embed/ysz5S6PUM-U"
            title="YouTube video"
            allowfullscreen>
    </iframe>

</body>
</html>
